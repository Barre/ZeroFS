name: kernel-target-updates

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
    inputs:
      as_of:
        description: UTC discovery time (YYYY-MM-DDTHH:MM:SSZ)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: kernel-target-updates
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve discovery channels
    if: >-
      github.ref ==
      format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-26.04
    outputs:
      as_of: ${{ steps.resolve.outputs.as_of }}
      base_sha: ${{ steps.resolve.outputs.base_sha }}
      matrix: ${{ steps.resolve.outputs.matrix }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Resolve discovery inputs
        id: resolve
        env:
          REQUESTED_AS_OF: ${{ inputs.as_of }}
        run: |
          matrix=$(packaging/kernel/kernel-targets.py \
            --manifest packaging/kernel/kernels.lock.json \
            discovery-matrix)

          if [[ -n "$REQUESTED_AS_OF" ]]; then
            as_of=$REQUESTED_AS_OF
          else
            as_of=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          fi
          timestamp_pattern='^[0-9]{4}-[0-9]{2}-[0-9]{2}T'
          timestamp_pattern+='[0-9]{2}:[0-9]{2}:[0-9]{2}Z$'
          [[ "$as_of" =~ $timestamp_pattern ]]

          {
            echo "as_of=$as_of"
            echo "base_sha=$(git rev-parse HEAD)"
            echo "matrix=$matrix"
          } >>"$GITHUB_OUTPUT"

  discover:
    name: Discover ${{ matrix.id }}
    needs: resolve
    runs-on: ${{ matrix.runner }}
    container:
      image: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.resolve.outputs.matrix) }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.resolve.outputs.base_sha }}
          persist-credentials: false

      - name: Install Python
        run: |
          if command -v python3 >/dev/null 2>&1; then
            python3 --version
            exit 0
          fi
          if command -v apt-get >/dev/null 2>&1; then
            apt-get update
            DEBIAN_FRONTEND=noninteractive apt-get install -y \
              --no-install-recommends python3
          elif command -v dnf >/dev/null 2>&1; then
            dnf install -y python3
          elif command -v zypper >/dev/null 2>&1; then
            zypper --non-interactive install python3
          else
            echo "cannot install Python in the discovery container" >&2
            exit 1
          fi

      - name: Discover kernel candidate
        env:
          AS_OF: ${{ needs.resolve.outputs.as_of }}
          CHANNEL_ID: ${{ matrix.id }}
        run: |
          python3 packaging/kernel/kernel-targets.py \
            --manifest packaging/kernel/kernels.lock.json \
            discover "$CHANNEL_ID" --as-of "$AS_OF" \
            --output "kernel-candidates/$CHANNEL_ID.json"

      - name: Upload update candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: kernel-candidate-${{ matrix.id }}
          path: kernel-candidates
          if-no-files-found: error
          retention-days: 1

  propose:
    name: Propose kernel target updates
    needs: [resolve, discover]
    if: >-
      ${{
        always() &&
        needs.resolve.result == 'success' &&
        (needs.discover.result == 'success' ||
         needs.discover.result == 'failure')
      }}
    runs-on: ubuntu-26.04
    permissions:
      actions: write
      contents: write
      pull-requests: write
    env:
      UPDATE_BRANCH: automation/kernel-target-updates
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          ref: ${{ needs.resolve.outputs.base_sha }}

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        continue-on-error: ${{ needs.discover.result == 'failure' }}
        with:
          pattern: kernel-candidate-*
          path: kernel-candidates
          merge-multiple: true

      - name: Reconcile update branch
        id: branch
        env:
          BASE_SHA: ${{ needs.resolve.outputs.base_sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: .github/scripts/kernel-target-updates/reconcile-update-branch.sh

      - name: Reconcile update pull request
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        env:
          CHANGED: ${{ steps.branch.outputs.changed }}
        with:
          script: |
            const run = require("./.github/scripts/kernel-target-updates/reconcile-update-pull-request.js");
            await run({ github, context });

      - name: Ensure CI for the update commit
        if: steps.branch.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ steps.branch.outputs.head_sha }}
        run: .github/scripts/kernel-target-updates/ensure-ci.sh
