name: kernel-packages

on:
  workflow_call:
    inputs:
      checkout-ref:
        description: Immutable source and tooling ref; defaults to the event commit
        type: string
    outputs:
      package-version:
        description: Version read from the audited source-DKMS packages
        value: ${{ jobs.source-package.outputs.package_version }}

permissions:
  contents: read

jobs:
  source-package:
    name: Build source-DKMS packages
    runs-on: ubuntu-26.04
    outputs:
      matrix: ${{ steps.resolve.outputs.matrix }}
      package_version: ${{ steps.audit.outputs.version }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ inputs.checkout-ref || github.sha }}

      - name: Validate kernel tooling and resolve targets
        id: resolve
        run: .github/scripts/kernel-packages/resolve.sh

      - name: Install package tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cpio docker.io rpm
          sudo systemctl start docker
          docker version
          .github/scripts/install-nfpm.sh

      - name: Build source-DKMS packages
        run: packaging/kernel/kernel-source-package.py --output staged

      - name: Audit source-DKMS packages
        id: audit
        run: |
          version=$(kernel/ci/dkms-package-smoke.py \
            staged/deb/*.deb staged/rpm/*.rpm)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install and remove source-DKMS packages
        run: |
          kernel/ci/dkms-package-install-smoke.sh \
            staged/deb/*.deb staged/rpm/*.rpm

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: zerofs-kernel-source-packages
          path: staged
          if-no-files-found: error
          retention-days: 3

  target:
    name: DKMS build (${{ matrix.id }})
    needs: source-package
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.source-package.outputs.matrix) }}
    env:
      ZEROFS_KERNEL_ARTIFACT_DIR: /tmp/zerofs-kernel-${{ matrix.id }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ inputs.checkout-ref || github.sha }}

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: zerofs-kernel-source-packages
          path: kernel-packages

      - name: Install target-build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils busybox-static docker.io kmod rpm
          sudo systemctl start docker
          docker version

      - name: Install and build the source package
        run: |
          packaging/kernel/build-target.sh \
            --manifest packaging/kernel/kernels.lock.json \
            --target-id "${{ matrix.id }}" \
            --source-package kernel-packages \
            --output-dir "$ZEROFS_KERNEL_ARTIFACT_DIR"

      - name: Upload target artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: zerofs-kernel-${{ matrix.id }}
          path: ${{ env.ZEROFS_KERNEL_ARTIFACT_DIR }}
          if-no-files-found: warn
          retention-days: 7

  smoke:
    name: Kernel boot (${{ matrix.id }})
    needs: [source-package, target]
    if: >-
      ${{
        !cancelled() &&
        needs.source-package.result == 'success' &&
        (needs.target.result == 'success' ||
         needs.target.result == 'failure')
      }}
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.source-package.outputs.matrix) }}
    env:
      ZEROFS_KERNEL_ARTIFACT_DIR: /tmp/zerofs-kernel-${{ matrix.id }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ inputs.checkout-ref || github.sha }}

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: zerofs-kernel-${{ matrix.id }}
          path: ${{ env.ZEROFS_KERNEL_ARTIFACT_DIR }}

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: zerofs-ci-bin
          path: zerofs/target/ci

      - name: Install boot-test tools
        run: |
          case '${{ matrix.arch }}' in
            x86_64) qemu_package=qemu-system-x86 ;;
            aarch64) qemu_package=qemu-system-arm ;;
            *) exit 1 ;;
          esac
          chmod +x zerofs/target/ci/zerofs
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils cpio kmod "$qemu_package"

      - name: Load and exercise ZeroFS
        run: |
          kernel/ci/module-smoke.sh artifact \
            packaging/kernel/kernels.lock.json \
            "${{ matrix.id }}" \
            "$ZEROFS_KERNEL_ARTIFACT_DIR" \
            zerofs/target/ci/zerofs
