name: ci

# Single entry point for the test suites that all run the same ci-profile ZeroFS
# binary. The binary is built once (build job) and every suite downloads it as the
# zerofs-ci-bin artifact instead of recompiling ZeroFS on its own runner. The suites
# are reusable workflows (on: workflow_call) invoked here, so they share this run and
# can see the artifact. Exact-kernel DKMS and boot tests reuse that server.
#
# Suites that need a different binary keep their own push/PR workflows and are NOT
# wired in here: cross-compile (other targets + webui), release-pgo (release/PGO),
# ffi (debug), rust (debug + tests), docker / csi-docker (released/cross binaries),
# bench, webui, publish-client.
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
    # The kernel target updater dispatches this workflow for its exact head.
    paths-ignore:
      - "packaging/kernel/kernels.lock.json"
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Commit expected at the dispatched ref
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dispatch-ref:
    name: Verify dispatched ref
    runs-on: ubuntu-26.04
    steps:
      - name: Require the expected commit
        if: ${{ inputs.expected_sha != '' }}
        env:
          ACTUAL_SHA: ${{ github.sha }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          if [[ ! "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "invalid expected commit: $EXPECTED_SHA" >&2
            exit 1
          fi
          if [[ "$ACTUAL_SHA" != "$EXPECTED_SHA" ]]; then
            echo "dispatched ref resolved to $ACTUAL_SHA, expected $EXPECTED_SHA" >&2
            exit 1
          fi

  build:
    uses: ./.github/workflows/_build-ci-bin.yml

  jepsen:
    needs: build
    uses: ./.github/workflows/jepsen.yml
  jepsen-ha:
    needs: build
    uses: ./.github/workflows/jepsen-ha.yml

  kernel-compile-9p:
    needs: build
    uses: ./.github/workflows/kernel-compile-9p.yml
  kernel-compile-fuse:
    needs: build
    uses: ./.github/workflows/kernel-compile-fuse.yml
  kernel-compile-nfs:
    needs: build
    uses: ./.github/workflows/kernel-compile-nfs.yml
  kernel-packages:
    needs: build
    uses: ./.github/workflows/kernel-packages.yml

  pjdfstest:
    needs: build
    uses: ./.github/workflows/pjdfstest.yml
  pjdfstest-9p:
    needs: build
    uses: ./.github/workflows/pjdfstest-9p.yml
  pjdfstest-fuse:
    needs: build
    uses: ./.github/workflows/pjdfstest-fuse.yml

  stress-ng:
    needs: build
    uses: ./.github/workflows/stress-ng.yml

  xfstests-9p:
    needs: build
    uses: ./.github/workflows/xfstests-9p.yml
  xfstests-fuse:
    needs: build
    uses: ./.github/workflows/xfstests-fuse.yml
  xfstests-nfs:
    needs: build
    uses: ./.github/workflows/xfstests-nfs.yml

  zfs-test:
    needs: build
    uses: ./.github/workflows/zfs-test.yml

  csi-sanity:
    needs: build
    uses: ./.github/workflows/csi-sanity.yml
  csi-e2e-k3s:
    needs: build
    uses: ./.github/workflows/csi-e2e-k3s.yml

  required:
    name: required
    if: ${{ always() }}
    needs:
      - build
      - jepsen
      - jepsen-ha
      - kernel-compile-9p
      - kernel-compile-fuse
      - kernel-compile-nfs
      - kernel-packages
      - pjdfstest
      - pjdfstest-9p
      - pjdfstest-fuse
      - stress-ng
      - xfstests-9p
      - xfstests-fuse
      - xfstests-nfs
      - zfs-test
      - csi-sanity
      - csi-e2e-k3s
      - dispatch-ref
    runs-on: ubuntu-26.04
    steps:
      - name: Require every CI job
        env:
          NEEDS_CONTEXT: ${{ toJSON(needs) }}
        run: |
          failures=$(jq -r '
            to_entries[] |
            select(.value.result != "success") |
            "\(.key)=\(.value.result)"
          ' <<<"$NEEDS_CONTEXT")
          if [[ -n "$failures" ]]; then
            printf 'Required CI jobs did not succeed:\n%s\n' "$failures" >&2
            exit 1
          fi
