name: kernel-package-publish

# Builds every kernel-client target with publish: true and passes each channel
# to the repository publisher shared with userspace packages.

on:
  release:
    types: [published]
  push:
    branches: [main]
    paths:
      - packaging/kernel/targets.json
  workflow_dispatch:
    inputs:
      tag:
        description: Stable ZeroFS release tag; defaults to the latest release
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-packages
  cancel-in-progress: false

env:
  NFPM_VERSION: "2.47.0"
  NFPM_SHA256_X86_64: "0660ca602b2d2d2ae4781a06c692b3eeb9d437ffea05b831d76e41f4a3188783"
  NFPM_SHA256_ARM64: "1c0f5f2999b9a974bfb04fdb0cc3306096de530ac5dbb25d739cc5f5219c919c"

jobs:
  resolve:
    name: Resolve release and targets
    if: >-
      ${{
        github.event_name != 'release' ||
        github.event.release.prerelease == false
      }}
    runs-on: ubuntu-26.04
    outputs:
      has_targets: ${{ steps.targets.outputs.has_targets }}
      matrix: ${{ steps.targets.outputs.matrix }}
      release_commit: ${{ steps.identity.outputs.release_commit }}
      source_date_epoch: ${{ steps.identity.outputs.source_date_epoch }}
      tag: ${{ steps.release.outputs.tag }}
      tooling_commit: ${{ steps.identity.outputs.tooling_commit }}
      version: ${{ steps.identity.outputs.version }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          path: tooling
          persist-credentials: false
          ref: >-
            ${{
              github.event_name == 'push' &&
              github.sha ||
              github.event.repository.default_branch
            }}

      - name: Resolve stable release
        id: release
        env:
          EVENT_TAG: ${{ github.event.release.tag_name }}
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          tag=$REQUESTED_TAG
          if [[ "$GITHUB_EVENT_NAME" == release ]]; then
            tag=$EVENT_TAG
          fi
          if [[ -n "$tag" ]]; then
            [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
            endpoint="repos/$GITHUB_REPOSITORY/releases/tags/$tag"
          else
            endpoint="repos/$GITHUB_REPOSITORY/releases/latest"
          fi
          release=$(gh api "$endpoint")
          [[ $(jq -r .draft <<<"$release") == false ]]
          [[ $(jq -r .prerelease <<<"$release") == false ]]
          tag=$(jq -r .tag_name <<<"$release")
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "tag=$tag" >>"$GITHUB_OUTPUT"

      - name: Select targets
        id: targets
        env:
          BASE_SHA: ${{ github.event.before }}
        run: |
          helper=tooling/packaging/kernel/kernel-targets.py
          manifest=tooling/packaging/kernel/targets.json
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
            git -C tooling cat-file -e "$BASE_SHA^{commit}"
            base_path=$(
              git -C tooling ls-tree --name-only "$BASE_SHA" -- \
                packaging/kernel/targets.json
            )
            if [[ -n "$base_path" ]]; then
              [[ "$base_path" == packaging/kernel/targets.json ]]
              base_manifest="$RUNNER_TEMP/kernel-targets-base.json"
              git -C tooling show \
                "$BASE_SHA:packaging/kernel/targets.json" \
                >"$base_manifest"
              matrix=$(
                "$helper" --manifest "$manifest" \
                  published --base "$base_manifest"
              )
            else
              matrix=$(
                "$helper" --manifest "$manifest" matrix --scope publish
              )
            fi
          else
            matrix=$(
              "$helper" --manifest "$manifest" matrix --scope publish
            )
          fi
          count=$(jq '.include | length' <<<"$matrix")
          echo "matrix=$matrix" >>"$GITHUB_OUTPUT"
          if ((count)); then
            echo "has_targets=true" >>"$GITHUB_OUTPUT"
          else
            echo "has_targets=false" >>"$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          path: source
          persist-credentials: false
          ref: ${{ steps.release.outputs.tag }}

      - name: Verify source and tooling
        id: identity
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          version=$(
            cd source && python3 - <<'PY'
          import tomllib

          with open("zerofs/Cargo.toml", "rb") as cargo_toml:
              print(tomllib.load(cargo_toml)["workspace"]["package"]["version"])
          PY
          )
          [[ "$RELEASE_TAG" == "v$version" ]] || {
            echo "release tag $RELEASE_TAG does not match zerofs $version" >&2
            exit 1
          }
          for required in \
            kernel/Kbuild \
            kernel/stage-module-source.sh; do
            [[ -f "source/$required" ]] || {
              echo "release $RELEASE_TAG predates the native kernel client" >&2
              exit 1
            }
          done
          release_commit=$(git -C source rev-parse --verify "HEAD^{commit}")
          [[ "$release_commit" == \
             "$(git -C source rev-list -n 1 "$RELEASE_TAG")" ]] || {
            echo "source HEAD does not match $RELEASE_TAG" >&2
            exit 1
          }
          [[ -z "$(git -C source status --porcelain)" ]]
          [[ -z "$(git -C tooling status --porcelain)" ]]
          {
            echo "release_commit=$release_commit"
            echo "source_date_epoch=$(
              git -C source show -s --format=%ct "$release_commit"
            )"
            echo "tooling_commit=$(
              git -C tooling rev-parse --verify 'HEAD^{commit}'
            )"
            echo "version=$version"
          } >>"$GITHUB_OUTPUT"

  build:
    name: Kernel package (${{ matrix.id }})
    needs: resolve
    if: needs.resolve.outputs.has_targets == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.resolve.outputs.matrix) }}
    env:
      SOURCE_DATE_EPOCH: ${{ needs.resolve.outputs.source_date_epoch }}
      ZEROFS_KERNEL_ARTIFACT_DIR: /tmp/zerofs-kernel-${{ matrix.id }}
      ZEROFS_KERNEL_PACKAGE_LICENSE: ${{ vars.KERNEL_MODULE_PACKAGE_LICENSE }}
      ZEROFS_KERNEL_TARGET_ID: ${{ matrix.id }}
      ZEROFS_RELEASE_VERSION: ${{ needs.resolve.outputs.version }}
      ZEROFS_SERVER: /tmp/zerofs-release-server
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: tooling
          persist-credentials: false
          ref: ${{ needs.resolve.outputs.tooling_commit }}

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          path: source
          persist-credentials: false
          ref: ${{ needs.resolve.outputs.release_commit }}

      - name: Install build and smoke tools
        run: |
          case '${{ matrix.arch }}' in
            x86_64)
              nfpm_arch=x86_64
              nfpm_sha=$NFPM_SHA256_X86_64
              qemu_package=qemu-system-x86
              ;;
            aarch64)
              nfpm_arch=arm64
              nfpm_sha=$NFPM_SHA256_ARM64
              qemu_package=qemu-system-arm
              ;;
            *)
              echo "unsupported package architecture" >&2
              exit 1
              ;;
          esac
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils busybox-static cpio diffutils docker.io kmod openssl \
            "$qemu_package" rpm sbsigntool
          install -d -m 0755 "$HOME/.local/bin"
          archive="$RUNNER_TEMP/nfpm.tar.gz"
          url="https://github.com/goreleaser/nfpm/releases/download"
          url+="/v${NFPM_VERSION}"
          url+="/nfpm_${NFPM_VERSION}_Linux_${nfpm_arch}.tar.gz"
          curl -fsSL "$url" -o "$archive"
          echo "$nfpm_sha  $archive" | sha256sum --check -
          tar xzf "$archive" -C "$HOME/.local/bin" nfpm
          echo "$HOME/.local/bin" >>"$GITHUB_PATH"
          sudo systemctl start docker
          docker version

      - name: Build package
        env:
          SIGNING_CERT_PEM: ${{ secrets.KERNEL_MODULE_SIGNING_CERT }}
          SIGNING_KEY_PEM: ${{ secrets.KERNEL_MODULE_SIGNING_KEY }}
          ZEROFS_MODULE_SIGN_HASH: sha256
          ZEROFS_MODULE_SIGNER: /usr/bin/kmodsign
          ZEROFS_REQUIRE_CLEAN_SOURCE: "1"
          ZEROFS_TARGET_STRIP: /usr/bin/strip
        run: |
          [[ -n "$SIGNING_KEY_PEM" && -n "$SIGNING_CERT_PEM" ]]
          signing_dir="$RUNNER_TEMP/zerofs-module-signing"
          install -d -m 0700 "$signing_dir"
          cleanup_signing() {
            rm -f -- \
              "$signing_dir/key.pem" \
              "$signing_dir/cert.pem" \
              "$signing_dir/key.pub" \
              "$signing_dir/cert.pub"
            rmdir "$signing_dir" 2>/dev/null || true
          }
          trap cleanup_signing EXIT
          umask 077
          printf '%s\n' "$SIGNING_KEY_PEM" >"$signing_dir/key.pem"
          printf '%s\n' "$SIGNING_CERT_PEM" >"$signing_dir/cert.pem"
          openssl pkey -in "$signing_dir/key.pem" -noout -passin pass:
          openssl x509 -in "$signing_dir/cert.pem" \
            -noout -checkend 2592000
          openssl pkey -in "$signing_dir/key.pem" -passin pass: -pubout \
            -out "$signing_dir/key.pub"
          openssl x509 -in "$signing_dir/cert.pem" -pubkey -noout \
            >"$signing_dir/cert.pub"
          cmp -s "$signing_dir/key.pub" "$signing_dir/cert.pub"

          install -d -m 0755 "$ZEROFS_KERNEL_ARTIFACT_DIR"
          ZEROFS_MODULE_SIGN_KEY="$signing_dir/key.pem" \
          ZEROFS_MODULE_SIGN_CERT="$signing_dir/cert.pem" \
            tooling/packaging/kernel/build-target.sh \
              --manifest tooling/packaging/kernel/targets.json \
              --target-id "$ZEROFS_KERNEL_TARGET_ID" \
              --output-dir "$ZEROFS_KERNEL_ARTIFACT_DIR" \
              --source-root source
          [[ -s "$ZEROFS_KERNEL_ARTIFACT_DIR/artifact.json" ]]

      - name: Audit package
        run: |
          tooling/kernel/ci/package-smoke.sh \
            --manifest tooling/packaging/kernel/targets.json \
            --target-id "$ZEROFS_KERNEL_TARGET_ID" \
            --artifact-dir "$ZEROFS_KERNEL_ARTIFACT_DIR" \
            --expected-version "${{ needs.resolve.outputs.version }}"

      - name: Download released server
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          release_dir="$RUNNER_TEMP/zerofs-release"
          install -d -m 0755 "$release_dir"
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern zerofs-pgo-multiplatform.tar.gz \
            --pattern zerofs-pgo-multiplatform.tar.gz.sha256 \
            --dir "$release_dir"
          (
            cd "$release_dir"
            sha256sum --check zerofs-pgo-multiplatform.tar.gz.sha256
          )
          case '${{ matrix.arch }}' in
            x86_64) member=zerofs-linux-amd64-pgo ;;
            aarch64) member=zerofs-linux-arm64-pgo ;;
            *) exit 1 ;;
          esac
          tar xzf "$release_dir/zerofs-pgo-multiplatform.tar.gz" \
            -C "$release_dir" "$member"
          install -m 0755 "$release_dir/$member" "$ZEROFS_SERVER"
          [[ "$("$ZEROFS_SERVER" --version)" == \
             "zerofs ${{ needs.resolve.outputs.version }}" ]]

      - name: Mount and exercise package
        run: |
          tooling/kernel/ci/module-smoke.sh package \
            tooling/packaging/kernel/targets.json \
            "$ZEROFS_KERNEL_TARGET_ID" \
            "$ZEROFS_KERNEL_ARTIFACT_DIR" \
            "$ZEROFS_SERVER"

      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: zerofs-kernel-${{ matrix.id }}-${{ needs.resolve.outputs.version }}
          path: ${{ env.ZEROFS_KERNEL_ARTIFACT_DIR }}
          if-no-files-found: warn
          retention-days: 7

  stage:
    name: Stage kernel packages
    needs: [resolve, build]
    if: >-
      ${{
        !cancelled() &&
        needs.resolve.outputs.has_targets == 'true' &&
        needs.build.result == 'success'
      }}
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.stage.outputs.matrix }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: tooling
          persist-credentials: false
          ref: ${{ needs.resolve.outputs.tooling_commit }}

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: zerofs-kernel-*-${{ needs.resolve.outputs.version }}
          path: kernel-artifacts

      - name: Validate and stage packages
        id: stage
        env:
          MATRIX: ${{ needs.resolve.outputs.matrix }}
          RELEASE_COMMIT: ${{ needs.resolve.outputs.release_commit }}
          TOOLING_COMMIT: ${{ needs.resolve.outputs.tooling_commit }}
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          artifact_args=()
          while IFS= read -r target; do
            directory="kernel-artifacts/zerofs-kernel-$target-$VERSION"
            [[ -d "$directory" ]]
            artifact_args+=(--artifact "$target=$directory")
          done < <(jq -er '.include[].id' <<<"$MATRIX")

          matrix=$(
            tooling/packaging/kernel/kernel-artifacts.py \
              --manifest tooling/packaging/kernel/targets.json \
              --version "$VERSION" \
              --source-commit "$RELEASE_COMMIT" \
              --tooling-commit "$TOOLING_COMMIT" \
              "${artifact_args[@]}" \
              --output staged
          )
          echo "matrix=$matrix" >>"$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: zerofs-kernel-staged-${{ github.run_id }}
          path: staged
          if-no-files-found: error
          retention-days: 3

  signing-material:
    name: Attach module signing material
    needs: [resolve, stage]
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: zerofs-kernel-staged-${{ github.run_id }}
          path: staged

      - name: Preflight and attach certificate
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          existing="$RUNNER_TEMP/existing-assets"
          install -d -m 0755 "$existing"
          release_id=$(
            gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" \
              --jq .id
          )
          [[ "$release_id" =~ ^[1-9][0-9]*$ ]]
          gh api --paginate \
            "repos/$GITHUB_REPOSITORY/releases/$release_id/assets?per_page=100" \
            --jq '.[].name' >"$existing/names"

          uploads=()
          for name in zerofs-module-signing-cert.der \
                      zerofs-module-signing-cert.fingerprint; do
            if grep -Fxq "$name" "$existing/names"; then
              gh release download "$RELEASE_TAG" \
                --repo "$GITHUB_REPOSITORY" \
                --pattern "$name" \
                --dir "$existing"
              cmp -s "staged/$name" "$existing/$name" || {
                echo "existing release asset changed: $name" >&2
                exit 1
              }
            else
              uploads+=("staged/$name")
            fi
          done
          if ((${#uploads[@]})); then
            gh release upload "$RELEASE_TAG" "${uploads[@]}" \
              --repo "$GITHUB_REPOSITORY"
          fi

  publish:
    name: Publish ${{ matrix.id }}
    needs: [resolve, stage, signing-material]
    permissions:
      contents: write
    strategy:
      max-parallel: 1
      matrix: ${{ fromJSON(needs.stage.outputs.matrix) }}
    uses: ./.github/workflows/_publish-repo.yml
    with:
      family: ${{ matrix.family }}
      prefix: ${{ matrix.prefix }}
      artifact-name: zerofs-kernel-staged-${{ github.run_id }}
      package-directory: ${{ matrix.id }}
      codename: ${{ matrix.codename }}
      component: ${{ matrix.component }}
      architectures: ${{ matrix.architectures }}
      probe-package: ${{ matrix.probe_package }}
      probe-version: ${{ matrix.probe_version }}
      descriptor-key: ${{ matrix.descriptor_key }}
      descriptor-id: ${{ matrix.descriptor_id }}
      descriptor-name: ${{ matrix.descriptor_name }}
      release-tag: ${{ needs.resolve.outputs.tag }}
    secrets:
      GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
