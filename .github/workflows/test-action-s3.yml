name: Test ZeroFS Action with SeaweedFS

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
    paths-ignore:
      - "packaging/kernel/kernels.lock.json"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-with-seaweedfs:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    # Also read by verify-action-persistence.sh.
    env:
      OBJECT_STORE_URL: "s3://test-bucket/github-actions-test"
      ZEROFS_ENCRYPTION_PASSWORD: "test-password-123"
      AWS_ACCESS_KEY_ID: "zerofsadmin"
      AWS_SECRET_ACCESS_KEY: "zerofsadmin"
      AWS_ENDPOINT: "http://localhost:9000"
      AWS_ALLOW_HTTP: "true"
      AWS_DEFAULT_REGION: "us-east-1"

    steps:
      - uses: actions/checkout@v7

      - name: Start SeaweedFS
        run: bash .github/scripts/seaweedfs.sh start test-bucket

      # Post steps run in reverse order, so this checks after the action's cleanup.
      - name: Verify the volume persists after shutdown
        uses: ./.github/actions/post-run
        with:
          run: bash .github/scripts/verify-action-persistence.sh test-dir/test.txt "Hello from GitHub Actions on ${{ matrix.os }}!"

      - name: Setup ZeroFS Volume
        id: setup-zerofs
        uses: ./
        with:
          object-store-url: ${{ env.OBJECT_STORE_URL }}
          encryption-password: ${{ env.ZEROFS_ENCRYPTION_PASSWORD }}
          aws-access-key-id: ${{ env.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ env.AWS_SECRET_ACCESS_KEY }}
          aws-endpoint: ${{ env.AWS_ENDPOINT }}
          aws-allow-http: ${{ env.AWS_ALLOW_HTTP }}
          aws-region: ${{ env.AWS_DEFAULT_REGION }}
          cache-size-gb: "1"
          mount-path: "/mnt/zerofs-test"

      - name: Test Volume Operations
        run: |
          echo "Testing ZeroFS volume on ${{ matrix.os }}..."

          # Use the mount path from the action output
          MOUNT_PATH="${{ steps.setup-zerofs.outputs.mount-path }}"
          if [ -z "$MOUNT_PATH" ]; then
            MOUNT_PATH="/mnt/zerofs-test"
          fi

          sudo mkdir -p "$MOUNT_PATH/test-dir"
          echo "Hello from GitHub Actions on ${{ matrix.os }}!" | sudo tee "$MOUNT_PATH/test-dir/test.txt"
          sudo cat "$MOUNT_PATH/test-dir/test.txt"
          sudo ls -la "$MOUNT_PATH/test-dir/"
          echo "Tests passed!"
