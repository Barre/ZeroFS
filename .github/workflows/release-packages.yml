name: Publish native packages

# Builds userspace and kernel-client packages for one release and publishes the
# signed repositories described in packaging/README.md.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to (re)publish, e.g. v2.3.0"
        required: true

permissions:
  contents: read

jobs:
  userspace-packages:
    name: Build userspace packages
    runs-on: ubuntu-26.04
    outputs:
      release-commit: ${{ steps.release.outputs.release_commit }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false

      - name: Verify release version
        id: release
        env:
          REQUESTED_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          TAG=$REQUESTED_TAG
          git check-ref-format "refs/tags/$TAG" >/dev/null
          git show-ref --verify --quiet "refs/tags/$TAG" || {
            echo "release tag does not exist: $TAG" >&2
            exit 1
          }
          RELEASE_COMMIT=$(git rev-list -n 1 "$TAG")
          [[ "$RELEASE_COMMIT" =~ ^([0-9a-f]{40}|[0-9a-f]{64})$ ]]
          [[ "$(git rev-parse HEAD)" == "$RELEASE_COMMIT" ]] || {
            echo "checked-out commit does not match release tag $TAG" >&2
            exit 1
          }
          VERSION=$(python3 - <<'PY'
          import tomllib

          with open("zerofs/Cargo.toml", "rb") as cargo_toml:
              print(tomllib.load(cargo_toml)["workspace"]["package"]["version"])
          PY
          )
          if [[ "$TAG" != "v$VERSION" ]]; then
            echo "release tag $TAG does not match zerofs version $VERSION" >&2
            exit 1
          fi
          {
            echo "release_commit=$RELEASE_COMMIT"
            echo "tag=$TAG"
            echo "version=$VERSION"
            echo "source_date_epoch=$(git show -s --format=%ct HEAD)"
          } >> "$GITHUB_OUTPUT"

      - name: Install package tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gettext-base rpm
          .github/scripts/install-nfpm.sh

      - name: Download release binaries
        run: |
          # Same source the Docker build pulls from: the release tarball asset.
          mkdir -p bin
          curl -fsSL \
            "https://github.com/${{ github.repository }}/releases/download/${{ steps.release.outputs.tag }}/zerofs-pgo-multiplatform.tar.gz" \
            | tar xz -C bin zerofs-linux-amd64-pgo zerofs-linux-arm64-pgo
          chmod +x bin/zerofs-linux-*-pgo

      - name: Build packages
        env:
          SOURCE_DATE_EPOCH: ${{ steps.release.outputs.source_date_epoch }}
        run: |
          mkdir -p out
          build() {  # $1 = nfpm arch, $2 = binary path
            export ARCH="$1" VERSION="${{ steps.release.outputs.version }}" BIN="$2"
            # shellcheck disable=SC2016
            envsubst '${ARCH} ${VERSION} ${BIN}' < packaging/nfpm.yaml > nfpm.rendered.yaml
            nfpm pkg -f nfpm.rendered.yaml -p deb -t out/
            nfpm pkg -f nfpm.rendered.yaml -p rpm -t out/
          }
          build amd64 bin/zerofs-linux-amd64-pgo
          build arm64 bin/zerofs-linux-arm64-pgo

          architectures=$(
            for package in out/*.deb; do
              dpkg-deb -f "$package" Architecture
            done | sort -u | xargs
          )
          [[ "$architectures" == "amd64 arm64" ]] || {
            echo "userspace DEBs do not cover amd64 and arm64 exactly" >&2
            exit 1
          }

          architectures=$(
            for package in out/*.rpm; do
              rpm -qp --qf '%{ARCH}\n' "$package"
            done | sort -u | xargs
          )
          [[ "$architectures" == "aarch64 x86_64" ]] || {
            echo "userspace RPMs do not cover x86_64 and aarch64 exactly" >&2
            exit 1
          }

          install -D -m 0755 \
            bin/zerofs-linux-amd64-pgo kernel-smoke-server/zerofs

      - name: Upload userspace packages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: zerofs-userspace-packages-${{ steps.release.outputs.version }}
          path: out
          if-no-files-found: error

      - name: Upload released kernel-smoke server
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: zerofs-ci-bin
          path: kernel-smoke-server
          if-no-files-found: error
          retention-days: 3

  kernel-package-gate:
    name: Build, test, and publish released kernel modules
    needs: userspace-packages
    uses: ./.github/workflows/kernel-packages.yml
    with:
      source-ref: ${{ needs['userspace-packages'].outputs['release-commit'] }}
      publish-modules: true
    secrets:
      KERNEL_MODULE_SIGNING_KEY: ${{ secrets.KERNEL_MODULE_SIGNING_KEY }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}

  publish-apt:
    name: Publish userspace APT repository
    needs: userspace-packages
    uses: ./.github/workflows/_publish-repo.yml
    with:
      family: deb
      artifact-name: zerofs-userspace-packages-${{ needs['userspace-packages'].outputs.version }}
      architectures: amd64 arm64
      probe-package: zerofs
      probe-version: ${{ needs['userspace-packages'].outputs.version }}
      # Tag pushes still use the release commit. A manual republish uses the
      # immutable workflow commit so publisher fixes can recover an old tag.
      tooling-ref: ${{ github.sha }}
    secrets:
      GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}

  publish-kernel-apt:
    name: Publish kernel-client APT package
    needs: kernel-package-gate
    uses: ./.github/workflows/_publish-repo.yml
    with:
      family: deb
      artifact-name: zerofs-kernel-source-packages
      package-directory: deb
      architectures: all
      probe-package: zerofs-kernel-client
      probe-version: ${{ needs['kernel-package-gate'].outputs['package-version'] }}
      tooling-ref: ${{ github.sha }}
    secrets:
      GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}

  publish-yum:
    name: Publish userspace YUM repository
    needs: userspace-packages
    uses: ./.github/workflows/_publish-repo.yml
    with:
      family: rpm
      artifact-name: zerofs-userspace-packages-${{ needs['userspace-packages'].outputs.version }}
      architectures: x86_64 aarch64
      probe-package: zerofs
      probe-version: ${{ format('{0}-1', needs['userspace-packages'].outputs.version) }}
      tooling-ref: ${{ github.sha }}
    secrets:
      GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}

  publish-kernel-yum:
    name: Publish kernel-client YUM package
    needs: kernel-package-gate
    uses: ./.github/workflows/_publish-repo.yml
    with:
      family: rpm
      artifact-name: zerofs-kernel-source-packages
      package-directory: rpm
      architectures: noarch
      probe-package: zerofs-kernel-client
      probe-version: ${{ needs['kernel-package-gate'].outputs['package-version'] }}
      tooling-ref: ${{ github.sha }}
    secrets:
      GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
